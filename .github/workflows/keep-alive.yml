name: Despertador de Supabase

on:
  schedule:
    # Se ejecuta todos los días a las 01:00 UTC (después del cron job)
    - cron: '0 1 * * *'
  workflow_dispatch: # Permite ejecutar manualmente

jobs:
  ping-databases:
    runs-on: ubuntu-latest
    steps:
      # --- PROYECTO CONSTRURED ---
      - name: Ping Construred
        run: |
          curl -X POST "${{ secrets.PROYECTO_CONSTRURED_URL }}/rest/v1/rpc/keep_alive_ping" \
          -H "apikey: ${{ secrets.PROYECTO_CONSTRURED_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.PROYECTO_CONSTRURED_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{}' \
          -w "\nStatus: %{http_code}\n"

      # --- PROYECTO GYMSYSTEM ---
      - name: Ping Gymsystem
        run: |
          curl -X POST "${{ secrets.PROYECTO_GYMSYSTEM_URL }}/rest/v1/rpc/keep_alive_ping" \
          -H "apikey: ${{ secrets.PROYECTO_GYMSYSTEM_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.PROYECTO_GYMSYSTEM_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{}' \
          -w "\nStatus: %{http_code}\n"
      # --- PROYECTO DARKOSYNC---
      - name: Ping etdfuvm (sin clave)
        run: |
          URL="https://etdfuvmburjfqkkvdrnq.supabase.co"
          echo "Pinging $URL (probando /auth/v1, /rest/v1 y raíz)..."
          for endpoint in "$URL/auth/v1" "$URL/rest/v1" "$URL"; do
            echo "Probando $endpoint"
            if curl -s -m 10 -I "$endpoint" | grep -q "HTTP/"; then
              echo "OK $endpoint"
              break
            else
              echo "Fallo $endpoint"
            fi
          done
      # Log de ejecución
      - name: Log execution
        run: |
          echo "✅ Keep-alive workflow executed at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "🔔 Next scheduled execution: Tomorrow at 01:00 UTC"
